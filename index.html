<meta name='viewport' content='width=device-width, initial-scale=1'/><!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DomUber 102.5 - Seguro</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700&display=swap" rel="stylesheet">
<style>
*{font-family:'Outfit',sans-serif;box-sizing:border-box}
body{margin:0;background:#05070a;color:#fff;min-height:100vh;padding-bottom:30px}
.hero{height:26vh;background:linear-gradient(0deg,#05070a 0%, transparent 100%), linear-gradient(90deg, rgba(0,102,255,0.4), transparent), url('https://images.unsplash.com/photo-1449965408869-eaa3f722e40d?auto=format&fit=crop&w=1000') center/cover;display:flex;align-items:end;padding:20px}
.badge{background:rgba(43,123,255,0.2);border:1px solid #2b7bff;color:#6ea8ff;padding:6px 12px;border-radius:20px;font-size:11px}
.hero h1{margin:8px 0 0;font-size:26px}.hero h1 span{color:#2b7bff}
.card{background:rgba(20,25,35,0.95);margin:12px;border-radius:18px;padding:16px;border:1px solid rgba(43,123,255,0.2)}
input,select{width:100%;background:#0f141e;border:1px solid #1e2a40;color:#fff;padding:13px;border-radius:12px;margin-top:8px;font-size:14px}
.btn-primary{width:100%;background:linear-gradient(90deg,#0066FF,#00C2FF);color:#fff;border:none;padding:15px;border-radius:12px;font-weight:700;margin-top:10px;cursor:pointer}
.btn-gps{width:100%;background:#1a2a45;border:1px solid #2b7bff;color:#6ea8ff;padding:12px;border-radius:12px;margin-top:8px;cursor:pointer;font-weight:700}
.corrida{background:#0f141e;border-left:3px solid #0066FF;padding:10px;border-radius:10px;margin-top:8px;border:1px solid #1a2a45}
.mapaGoogle{width:100%;height:300px;border-radius:12px;margin-top:8px;border:1px solid #1e2a40}
.sugestoes{background:#0f141e;border-radius:10px;max-height:110px;overflow:auto}
.sugestoes div{padding:9px;border-bottom:1px solid #1a2a45;cursor:pointer;font-size:12px}
.sugestoes div:hover{background:#1a2a45}
.small{color:#6b7d9a;font-size:11px}
.box-cad{background:#1a2a45;padding:12px;border-radius:12px;margin-bottom:12px;border:1px dashed #2b7bff}
</style>
</head>
<body>
<div class="hero"><div><div class="badge">DOM FM 87.5 • 102.5 OFICIAL SEGURO</div><h1>DomUber <span>102.5</span></h1></div></div>

<div class="card">
<select id="tipo" onchange="trocar()">
<option value="passageiro">🚶 PASSAGEIRO</option>
<option value="motorista">🚗 MOTORISTA</option>
<option value="admin">🔒 ADMIN DOM</option>
</select>
</div>

<div id="passageiro" class="card">
<h3 style="margin:0">Para onde vamos?</h3>
<input id="nome" placeholder="Seu nome">
<input id="whats" placeholder="Seu WhatsApp">
<input id="origem" placeholder="📍 Origem" oninput="buscar(this.value,'origem')">
<div id="sugOrigem" class="sugestoes"></div>
<button onclick="pegarMinhaLocalizacao()" class="btn-gps">📍 USAR MINHA LOCALIZAÇÃO ATUAL</button>
<input id="destino" placeholder="🏁 Destino" oninput="buscar(this.value,'destino')" style="margin-top:12px">
<div id="sugDestino" class="sugestoes"></div>
<div class="small" style="margin-top:10px">Mapa Google:</div>
<iframe id="mapaGoogle" class="mapaGoogle" src="https://maps.google.com/maps?q=Francisco%20Beltrão%20Paraná&t=&z=14&ie=UTF8&iwloc=&output=embed" loading="lazy"></iframe>
<div id="infoRota" class="small" style="margin-top:10px;color:#6ea8ff;font-weight:700"></div>
<input id="preco" type="number" placeholder="💰 Valor R$ - calcula R$2,00/km">
<button class="btn-primary" onclick="solicitar()">SOLICITAR AGORA →</button>
<div id="statusCorrida" class="small" style="margin-top:8px"></div>
</div>

<div id="motorista" class="card" style="display:none">
<div class="box-cad">
<h4 style="margin:0 0 8px 0">📝 Cadastro Motorista DOM</h4>
<input id="m_nome" placeholder="Seu nome completo">
<input id="m_whats" placeholder="WhatsApp 46999999999">
<input id="m_placa" placeholder="Placa ex: ABC1D23">
<input id="m_carro" placeholder="Carro ex: Onix Preto 2020">
<button class="btn-primary" onclick="cadastrarMotorista()">CADASTRAR COMO MOTORISTA</button>
<div id="m_status" class="small" style="margin-top:6px"></div>
</div>
<h3>Corridas ao vivo</h3><div id="lista"></div>
<div style="margin-top:20px"><h4>Motoristas Cadastrados</h4><div id="listaMotoristas"></div></div>
</div>

<div id="admin" class="card" style="display:none">
<h3>ADMIN DOM - Acesso Restrito</h3>
<input id="senhaAdmin" type="password" placeholder="••••••••">
<button class="btn-primary" onclick="logarAdmin()">ENTRAR</button>
<div id="painelAdmin" style="display:none"><div id="listaAdmin" style="margin-top:10px"></div><div id="listaAdminMotoristas" style="margin-top:20px"></div></div>
</div>

<script>
const SUPABASE_URL="https://iaquzqgonuozmsqargdk.supabase.co";
const SUPABASE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlhcXV6cWdvbnVvem1zcWFyZ2RrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg1MDkxMzksImV4cCI6MjEwNDA4NTEzOX0.6p7oaw9Eaw90nmagFiv5CWOx5FRM6TufDCwJEwwjYVc";
const supabaseClient=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let latO,lngO,latD,lngD;
function trocar(){const t=document.getElementById('tipo').value;document.getElementById('passageiro').style.display=t==='passageiro'?'block':'none';document.getElementById('motorista').style.display=t==='motorista'?'block':'none';document.getElementById('admin').style.display=t==='admin'?'block':'none';if(t==='motorista'){carregarCorridas();carregarMotoristas();}}
async function pegarMinhaLocalizacao(){
  if(!navigator.geolocation) return alert('Sem GPS');
  document.getElementById('infoRota').innerHTML = '📡 Pegando GPS...';
  navigator.geolocation.getCurrentPosition(async (pos)=>{
    latO = pos.coords.latitude; lngO = pos.coords.longitude;
    try{const r = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${latO}&lon=${lngO}`);const j = await r.json();document.getElementById('origem').value = j.display_name || `${latO.toFixed(5)}, ${lngO.toFixed(5)}`;}catch(e){document.getElementById('origem').value = `${latO.toFixed(5)}, ${lngO.toFixed(5)}`;}
    document.getElementById('mapaGoogle').src = `https://maps.google.com/maps?q=${latO},${lngO}&z=17&output=embed`;
    document.getElementById('infoRota').innerHTML = `✅ GPS OK!`; calcular();
  }, (err)=>{ alert('Ative o GPS: ' + err.message); }, {enableHighAccuracy:true});
}
function atualizarMapa(){ let q = document.getElementById('destino').value || document.getElementById('origem').value || 'Francisco Beltrão'; document.getElementById('mapaGoogle').src = `https://maps.google.com/maps?q=${encodeURIComponent(q)}%20Francisco%20Beltrao&t=&z=15&ie=UTF8&iwloc=&output=embed`; }
async function buscar(texto,tipo){if(texto.length<3)return; try{const r=await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(texto)}&limit=4&countrycodes=br&viewbox=-53.3,-25.6,-52.9,-25.9&bounded=1`); const dados=await r.json(); const div=document.getElementById(tipo==='origem'?'sugOrigem':'sugDestino'); div.innerHTML=dados.map(d=>`<div onclick="selecionar('${d.display_name.replace(/'/g,'')}','${d.lat}','${d.lon}','${tipo}')">${d.display_name.substring(0,70)}</div>`).join('');}catch(e){}}
function selecionar(nome,lat,lon,tipo){ if(tipo==='origem'){document.getElementById('origem').value=nome; latO=parseFloat(lat); lngO=parseFloat(lon); document.getElementById('sugOrigem').innerHTML='';} else{document.getElementById('destino').value=nome; latD=parseFloat(lat); lngD=parseFloat(lon); document.getElementById('sugDestino').innerHTML='';} atualizarMapa(); calcular(); }
function calcDist(la1,lo1,la2,lo2){const R=6371;const dLat=(la2-la1)*Math.PI/180;const dLon=(lo2-lo1)*Math.PI/180;const a=Math.sin(dLat/2)**2+Math.cos(la1*Math.PI/180)*Math.cos(la2*Math.PI/180)*Math.sin(dLon/2)**2;return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));}
function calcular(){ if(!latO||!latD) return; const dist = calcDist(latO,lngO,latD,lngD); const precoSugerido = (5 + dist * 2.0).toFixed(2); document.getElementById('infoRota').innerHTML = `📏 ${dist.toFixed(1)} km • R$2,00/km • Total R$ ${precoSugerido}`; document.getElementById('preco').value = precoSugerido; }
async function solicitar(){
const passageiro_nome=document.getElementById('nome').value;
const whatsapp=document.getElementById('whats').value;
const origem=document.getElementById('origem').value;
const destino=document.getElementById('destino').value;
const preco=parseFloat(document.getElementById('preco').value)||0;
if(!passageiro_nome||!origem||!destino) return alert('Preencha nome, origem e destino');
const {error}=await supabaseClient.from('corridas').insert([{passageiro_nome,origem,destino,preco,status:'procurando',origem_lat:latO,origem_lng:lngO,destino_lat:latD,destino_lng:lngD,whatsapp}]);
if(error) alert(error.message); else document.getElementById('statusCorrida').innerHTML='✅ Solicitado! Aguardando motorista DOM...';
}
async function carregarCorridas(){const{data}=await supabaseClient.from('corridas').select('*').eq('status','procurando').order('created_at',{ascending:false}); document.getElementById('lista').innerHTML=(data||[]).map(c=>`<div class="corrida"><b>${c.passageiro_nome}</b> • R$${c.preco}<br><small>${c.origem} → ${c.destino}</small><br><button class="btn-primary" style="padding:9px;margin-top:6px" onclick="aceitar('${c.id}')">ACEITAR CORRIDA</button> <a href="https://www.google.com/maps/dir/?api=1&destination=${c.origem_lat||''},${c.origem_lng||''}" target="_blank" style="color:#6ea8ff;font-size:12px;display:block;margin-top:6px">📍 Abrir GPS</a> <a href="https://wa.me/55${(c.whatsapp||'').replace(/\D/g,'')}" target="_blank" style="color:#25D366;font-size:12px;display:block;margin-top:4px">💬 WhatsApp</a></div>`).join('')||'Nenhuma corrida agora';}
async function aceitar(id){const motorista_nome=prompt('Seu nome motorista:')||'Motorista DOM'; await supabaseClient.from('corridas').update({status:'aceita',motorista_nome}).eq('id',id); carregarCorridas();}
async function cadastrarMotorista(){
  const nome=document.getElementById('m_nome').value;
  const whatsapp=document.getElementById('m_whats').value;
  const placa=document.getElementById('m_placa').value;
  const carro=document.getElementById('m_carro').value;
  if(!nome||!whatsapp||!placa||!carro) return alert('Preencha nome, whats, placa e carro');
  const {error}=await supabaseClient.from('motoristas').insert([{nome,whatsapp,placa,carro}]);
  if(error) alert(error.message); else {document.getElementById('m_status').innerHTML='✅ Cadastrado! Bem-vindo ao DOM'; carregarMotoristas();}
}
async function carregarMotoristas(){const{data}=await supabaseClient.from('motoristas').select('*').order('created_at',{ascending:false}).limit(20); document.getElementById('listaMotoristas').innerHTML=(data||[]).map(m=>`<div class="corrida">🚗 ${m.nome} - ${m.carro} - ${m.placa} <br><small>${m.whatsapp}</small></div>`).join('')||'';}
function logarAdmin(){
  if(btoa(document.getElementById('senhaAdmin').value)!=='QERvbS4yMDI3'){return alert('Acesso negado');}
  document.getElementById('painelAdmin').style.display='block'; carregarTodas();
}
async function carregarTodas(){const{data}=await supabaseClient.from('corridas').select('*').order('created_at',{ascending:false}).limit(50); document.getElementById('listaAdmin').innerHTML='<h4>Corridas</h4>'+(data||[]).map(c=>`<div class="corrida">${c.status.toUpperCase()} - ${c.passageiro_nome} (${c.motorista_nome||'-'})<br>${c.origem}→${c.destino} R$${c.preco}</div>`).join(''); const{data:motoristas}=await supabaseClient.from('motoristas').select('*').order('created_at',{ascending:false}); document.getElementById('listaAdminMotoristas').innerHTML='<h4>Motoristas</h4>'+(motoristas||[]).map(m=>`<div class="corrida">🚗 ${m.nome} | ${m.carro} | ${m.placa} | ${m.whatsapp} - ${m.status}</div>`).join('');}
supabaseClient.channel('geral').on('postgres_changes',{event:'*',schema:'public',table:'corridas'},()=>{if(document.getElementById('tipo').value==='motorista')carregarCorridas();}).subscribe();
</script>
</body>
</html>
