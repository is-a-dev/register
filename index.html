<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>NYANN SCRIPT HUB</title>

<!-- Pixel Font -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:var(--ui-font,"Press Start 2P",monospace);
    -webkit-tap-highlight-color:transparent;
}

html{
    scroll-behavior:smooth;
}

body{
    background:#060606;
    color:#fff;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:20px;
    overflow-x:hidden;
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    background-image:
        linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),
        linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);
    background-size:64px 64px;
    pointer-events:none;
}

.card{
    width:100%;
    max-width:720px;
    background:#111;
    border:2px solid #2e2e2e;
    border-radius:14px;
    padding:25px;
    position:relative;
    z-index:1;
    box-shadow:0 0 12px rgba(0,0,0,.5);
}

.logo{
    text-align:center;
    font-size:70px;
    margin-bottom:18px;
    user-select:none;
}

h1{
    text-align:center;
    font-size:18px;
    margin-bottom:10px;
}

.info{
    text-align:center;
    color:#888;
    font-size:8px;
    line-height:2;
    margin-bottom:20px;
}

.info a{
    color:var(--accent);
    text-decoration:none;
}

.info a:hover{
    text-decoration:underline;
}

.script-display{
    background:#090909;
    border:2px solid #2d2d2d;
    border-radius:10px;
    padding:15px;
    margin-bottom:16px;
}

.script-display .label{
    display:block;
    color:#777;
    font-size:8px;
    margin-bottom:8px;
}

.script-display .name{
    font-size:14px;
    color:var(--accent);
    margin-bottom:12px;
    word-break:break-word;
}

.script-display .code{
    background:#060606;
    border:1px solid #1d1d1d;
    border-radius:8px;
    padding:12px;
    font-size:8px;
    line-height:2;
    color:#ddd;
    white-space:pre-wrap;
    word-break:break-word;
    max-height:200px;
    overflow-y:auto;
}

.script-display .code::-webkit-scrollbar{
    width:4px;
}

.script-display .code::-webkit-scrollbar-track{
    background:#111;
}

.script-display .code::-webkit-scrollbar-thumb{
    background:#2d2d2d;
    border-radius:4px;
}

.copy-btn{
    width:100%;
    padding:16px;
    border:2px solid #555;
    background:#141414;
    color:#fff;
    font-size:10px;
    border-radius:10px;
    cursor:pointer;
    transition:.15s;
    margin-bottom:16px;
}

.copy-btn:hover{
    background:#fff;
    color:#000;
}

.copy-btn:active{
    transform:scale(.98);
}

/* Search Bar */
.search-box{
    display:flex;
    gap:8px;
    margin-bottom:12px;
    align-items:center;
}

.search-box input{
    flex:1;
    padding:12px 16px;
    background:#0a0a0a;
    border:2px solid #2d2d2d;
    border-radius:8px;
    color:#fff;
    font-size:9px;
    outline:none;
    transition:.15s;
}

.search-box input::placeholder{
    color:#555;
}

.search-box input:focus{
    border-color:var(--accent);
}

.search-box .search-icon{
    color:#555;
    font-size:12px;
    padding:8px;
}

.script-list-title{
    color:#888;
    font-size:8px;
    margin-bottom:12px;
    letter-spacing:1px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.script-list-title .count{
    color:#555;
    font-size:7px;
}

/* Chia 2 cột */
.script-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin-bottom:16px;
    max-height:350px;
    overflow-y:auto;
    padding:4px;
}

.script-grid::-webkit-scrollbar{
    width:4px;
}

.script-grid::-webkit-scrollbar-track{
    background:#111;
}

.script-grid::-webkit-scrollbar-thumb{
    background:#2d2d2d;
    border-radius:4px;
}

.script-item{
    padding:14px 16px;
    border:2px solid #2d2d2d;
    background:#0a0a0a;
    color:#aaa;
    font-size:8px;
    border-radius:8px;
    cursor:pointer;
    transition:.15s;
    text-align:center;
    width:100%;
    font-weight:bold;
    letter-spacing:0.5px;
}

.script-item:hover{
    background:#1a1a1a;
    border-color:#555;
    color:#fff;
    transform:translateY(-1px);
}

.script-item.active{
    border-color:var(--accent);
    color:var(--accent);
    background:var(--accent-bg);
    box-shadow:0 0 16px rgba(0,255,136,0.15);
}

.script-item:active{
    transform:scale(.96);
}

.script-item.hidden{
    display:none;
}

/* Highlight search */
.script-item .highlight{
    color:var(--accent);
}

#toast{
    margin-top:15px;
    text-align:center;
    font-size:8px;
    min-height:14px;
    color:var(--accent);
}

@media(max-width:600px){

.logo{
    font-size:55px;
}

h1{
    font-size:14px;
}

.script-display .name{
    font-size:11px;
}

.script-display .code{
    font-size:7px;
    padding:10px;
}

.copy-btn{
    font-size:9px;
    padding:14px;
}

.script-item{
    font-size:7px;
    padding:12px 12px;
}

.search-box input{
    font-size:8px;
    padding:10px 14px;
}

.script-list-title{
    font-size:7px;
}

.script-list-title .count{
    font-size:6px;
}

}

/* Hamburger Menu */
.menu-btn{
    position:absolute;
    top:18px;
    right:18px;
    width:44px;
    height:44px;
    border:2px solid #2d2d2d;
    border-radius:9px;
    background:#0a0a0a;
    color:#fff;
    font-size:20px;
    cursor:pointer;
    z-index:20;
    transition:.15s;
}
.menu-btn:hover{
    background:#fff;
    color:#000;
}
.menu-panel{
    position:absolute;
    top:70px;
    right:18px;
    width:230px;
    background:#0b0b0b;
    border:2px solid #2d2d2d;
    border-radius:10px;
    padding:12px;
    display:none;
    z-index:19;
    box-shadow:0 10px 30px rgba(0,0,0,.45);
}
.menu-panel.show{display:block;}
.menu-title{
    color:#888;
    font-size:8px;
    margin-bottom:10px;
    letter-spacing:1px;
}
.menu-link{
    display:block;
    width:100%;
    padding:12px;
    margin-bottom:8px;
    border:2px solid #2d2d2d;
    border-radius:8px;
    background:#111;
    color:#fff;
    text-decoration:none;
    text-align:center;
    font-size:8px;
    cursor:pointer;
}
.menu-link:last-child{margin-bottom:0;}
.menu-link:hover{
    background:#fff;
    color:#000;
}


.delta-panel{
    position:absolute;
    top:70px;
    right:18px;
    width:280px;
    background:#0b0b0b;
    border:2px solid #2d2d2d;
    border-radius:10px;
    padding:14px;
    display:none;
    z-index:21;
    box-shadow:0 10px 30px rgba(0,0,0,.5);
}
.delta-panel.show{display:block;}
.delta-panel h3{
    color:#fff;
    font-size:10px;
    margin-bottom:10px;
}
.delta-panel p{
    color:#888;
    font-size:7px;
    line-height:1.8;
    margin-bottom:12px;
}
.delta-online{
    display:block;
    width:100%;
    padding:12px;
    border:2px solid #2d2d2d;
    border-radius:8px;
    background:#111;
    color:#fff;
    text-decoration:none;
    text-align:center;
    font-size:8px;
}
.delta-online:hover{
    background:#fff;
    color:#000;
}


.client-info-panel{
    position:absolute;
    top:70px;
    right:18px;
    width:280px;
    background:#0b0b0b;
    border:2px solid #2d2d2d;
    border-radius:10px;
    padding:14px;
    display:none;
    z-index:22;
    box-shadow:0 10px 30px rgba(0,0,0,.5);
}
.client-info-panel.show{display:block;}
.client-info-panel h3{
    color:#fff;
    font-size:10px;
    margin:0 0 10px;
}
.client-info-panel p{
    color:#888;
    font-size:7px;
    line-height:1.8;
    margin:0 0 12px;
}
.client-online{
    display:block;
    width:100%;
    box-sizing:border-box;
    padding:12px;
    border:2px solid #2d2d2d;
    border-radius:8px;
    background:#111;
    color:#fff;
    text-align:center;
    font-size:8px;
    text-decoration:none;
    cursor:pointer;
    transition:.15s;
}
a.client-online:hover{
    background:#fff;
    color:#000;
    border-color:#fff;
}


.sub-panel{position:absolute;top:70px;right:18px;width:290px;max-height:70vh;overflow-y:auto;background:#0b0b0b;border:2px solid #2d2d2d;border-radius:10px;padding:12px;display:none;z-index:25;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.sub-panel.show{display:block}
.sub-title{color:#888;font-size:8px;margin-bottom:12px;letter-spacing:1px}
.status{float:right;font-size:6px}
.status.online{color:var(--accent)}
.status.offline{color:var(--accent)}
.setting-label{color:#777;font-size:7px;margin:4px 0 10px}
.color-grid,.font-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:10px}
.color-btn,.font-btn{padding:10px 6px;border:2px solid #2d2d2d;border-radius:8px;background:#111;color:#fff;font-family:var(--ui-font,"Press Start 2P",monospace);font-size:6px;cursor:pointer}
.color-btn:hover,.color-btn.active,.font-btn:hover,.font-btn.active{border-color:#555;box-shadow:none}
.back-btn,.reset-color-btn,.reset-font-btn{width:100%;padding:11px;border:2px solid #2d2d2d;border-radius:8px;background:#111;color:#fff;font-family:var(--ui-font,"Press Start 2P",monospace);font-size:7px;cursor:pointer;margin-top:7px}
.back-btn:hover,.reset-color-btn:hover,.reset-font-btn:hover{background:#fff;color:#000}


.menu-panel.show{display:block}
.menu-panel.show + .sub-panel{}
@media(max-width:600px){
    .menu-panel,.sub-panel,.client-info-panel{right:10px;max-width:calc(100vw - 20px);}
}


:root{
    --accent:#ffffff;
    --accent-rgb:0,255,136;
    --accent-bg:rgba(var(--accent-rgb),.10);
    --accent-glow:rgba(var(--accent-rgb),.20);
}

/* Everything that is an interface accent follows --accent */
.script-item.active,
.script-item .highlight{
    color:var(--accent) !important;
}

.script-item.active{
    border-color:var(--accent);
}


.script-item.active{
    background:var(--accent-bg);
    border-color:var(--accent) !important;
    box-shadow:0 0 16px var(--accent-glow);
}

.script-item:hover{
    border-color:var(--accent);
}

.script-item .highlight{
    color:var(--accent) !important;
}

.search-box input:focus{
    border-color:#555 !important;
    box-shadow:none;
}

.copy-btn:hover{
    border-color:#fff !important;
    color:#000 !important;
    background:#fff !important;
    box-shadow:none;
}

.menu-link:hover,
.menu-link:focus,
.back-btn:hover,
.reset-color-btn:hover{
    border-color:#fff !important;
    color:#000 !important;
}

.color-btn:hover,
.color-btn.active{
    border-color:#555 !important;
    box-shadow:none;
}

.client-online{
    color:#fff !important;
    border-color:#2d2d2d !important;
}

.status.online,
.status.offline{
    color:#fff !important;
}


/* ===== SCRIPT TAB COLOR SYNC =====
   Only the selected script tab uses the Settings accent color.
   All other interface elements remain black/white/gray. */
.script-item{
    transition:color .15s,background-color .15s,border-color .15s,box-shadow .15s;
}

.script-item:not(.active){
    color:#aaa !important;
    border-color:#2d2d2d !important;
    background:#0a0a0a !important;
}

.script-item:hover{
    color:#fff !important;
    border-color:#555 !important;
    background:#1a1a1a !important;
}

.script-item.active{
    color:var(--accent) !important;
    border-color:var(--accent) !important;
    background:var(--accent-bg) !important;
    box-shadow:0 0 16px var(--accent-glow) !important;
}

/* Keep Settings and the rest of the UI monochrome. */
.menu-btn,
.menu-link,
.client-online,
.color-btn,
.back-btn,
.reset-color-btn,
.search-box input,
.copy-btn,
.card,
.script-display,
.menu-panel,
.sub-panel,
.client-info-panel{
    color:#fff;
}

.menu-btn,
.menu-link,
.client-online,
.color-btn,
.back-btn,
.reset-color-btn,
.search-box input,
.copy-btn,
.card,
.script-display,
.menu-panel,
.sub-panel,
.client-info-panel{
    border-color:#2d2d2d !important;
}

.search-box input:focus{
    border-color:#555 !important;
    box-shadow:none !important;
}

.search-box input::placeholder{
    color:#555 !important;
    opacity:1;
}

.copy-btn:hover,
.menu-btn:hover,
.menu-link:hover,
.back-btn:hover,
.reset-color-btn:hover{
    background:#fff !important;
    color:#000 !important;
    border-color:#fff !important;
}

.color-btn:hover,
.color-btn.active{
    border-color:#555 !important;
    box-shadow:none !important;
}

</style>
</head>

<script>
const scriptName = document.getElementById('scriptName');
const scriptCode = document.getElementById('scriptCode');
const copyBtn = document.getElementById('copyBtn');
const toast = document.getElementById('toast');
const scriptItems = document.querySelectorAll('.script-item');
const searchInput = document.getElementById('searchInput');
const scriptCount = document.getElementById('scriptCount');

let currentName = '';
let currentCode = '';

// Search function
searchInput.addEventListener('input', function() {
    const searchText = this.value.toLowerCase().trim();
    let visibleCount = 0;
    
    scriptItems.forEach(item => {
        const name = item.dataset.name.toLowerCase();
        if (name.includes(searchText)) {
            item.classList.remove('hidden');
            visibleCount++;
        } else {
            item.classList.add('hidden');
        }
    });
    
    scriptCount.textContent = visibleCount + ' scripts';
});

// Script item click
scriptItems.forEach(item => {
    item.addEventListener('click', function() {
        scriptItems.forEach(i => i.classList.remove('active'));
        this.classList.add('active');
        
        const name = this.dataset.name;
        const code = this.dataset.code;
        
        scriptName.textContent = name;
        scriptCode.textContent = code;
        
        currentName = name;
        currentCode = code;
        
        showToast('✓ Loaded: ' + name);
    });
});

copyBtn.addEventListener('click', copyScript);

function showToast(msg, color){
    toast.textContent = msg;
    toast.style.color = color || getComputedStyle(document.documentElement).getPropertyValue("--accent").trim() || "#00ff88";
    clearTimeout(showToast.timer);
    showToast.timer = setTimeout(() => {
        toast.textContent = "";
    }, 2500);
}

async function copyScript(){
    const text = currentCode;
    
    if (!currentName || !text) {
        showToast('✗ NO SCRIPT SELECTED');
        return;
    }
    
    if(navigator.clipboard && window.isSecureContext){
        try{
            await navigator.clipboard.writeText(text);
            showToast('✓ ' + currentName + ' COPIED');
            return;
        }catch(e){}
    }
    
    const textarea = document.createElement("textarea");
    textarea.value = text;
    textarea.readOnly = true;
    textarea.style.position = "fixed";
    textarea.style.left = "-9999px";
    textarea.style.opacity = "0";
    document.body.appendChild(textarea);
    textarea.focus();
    textarea.select();
    
    let success = false;
    try{
        success = document.execCommand("copy");
    }catch(e){}
    textarea.remove();
    
    if(success){
        showToast('✓ ' + currentName + ' COPIED');
    }else{
        showToast('✗ COPY FAILED');
    }
}

function showClientInfo(name,description,status,url){
    let panel=document.getElementById("clientInfoPanel");
    if(!panel){panel=document.createElement("div");panel.id="clientInfoPanel";panel.className="client-info-panel";document.querySelector(".card").appendChild(panel);}
    
    if(url){
        panel.innerHTML=`<h3>${name}</h3><p>${description}</p><a class="client-online" href="${url}" target="_blank" rel="noopener noreferrer">${status}</a>`;

const defaultColor="#ffffff";
function hexToRgb(hex){
    hex=hex.replace("#","");
    if(hex.length===3) hex=hex.split("").map(x=>x+x).join("");
    const n=parseInt(hex,16);
    return [(n>>16)&255,(n>>8)&255,n&255];
}

function applyColor(color){
    const rgb=hexToRgb(color);
    const bg=`rgba(${rgb.join(",")},.10)`;
    const glow=`rgba(${rgb.join(",")},.20)`;

    document.documentElement.style.setProperty("--accent",color);
    document.documentElement.style.setProperty("--accent-rgb",rgb.join(","));
    document.documentElement.style.setProperty("--accent-bg",bg);
    document.documentElement.style.setProperty("--accent-glow",glow);

    // Keep the interface monochrome. The accent is used by the
    // currently selected script tab only.
    document.querySelectorAll(".script-item").forEach(el=>{
        el.style.color="";
        el.style.borderColor="";
        el.style.backgroundColor="";
        el.style.boxShadow="";
    });

    document.querySelectorAll(".color-btn").forEach(btn=>{
        btn.classList.toggle(
            "active",
            btn.dataset.color.toLowerCase()===color.toLowerCase()
        );
    });

    localStorage.setItem("nyannInterfaceColor",color);
}
colorGrid.addEventListener("click",e=>{
    const btn=e.target.closest(".color-btn");if(!btn)return;
    applyColor(btn.dataset.color);showToast("✓ COLOR: "+btn.textContent);
});
resetColorBtn.addEventListener("click",()=>{applyColor(defaultColor);showToast("✓ COLOR RESET");});

const defaultFont='"Press Start 2P",monospace';
function applyFont(font){
    document.documentElement.style.setProperty("--ui-font",font);
    document.body.style.fontFamily=font;
    document.querySelectorAll(".card, .card *").forEach(el=>el.style.fontFamily=font);
    document.querySelectorAll(".font-btn").forEach(btn=>btn.classList.toggle("active",btn.dataset.font===font));
    localStorage.setItem("nyannInterfaceFont",font);
}
fontGrid.addEventListener("click",e=>{
    const btn=e.target.closest(".font-btn"); if(!btn)return;
    applyFont(btn.dataset.font); showToast("✓ FONT: "+btn.textContent);
});
resetFontBtn.addEventListener("click",()=>{applyFont(defaultFont);showToast("✓ FONT RESET");});
applyFont(localStorage.getItem("nyannInterfaceFont")||defaultFont);
applyColor(localStorage.getItem("nyannInterfaceColor")||defaultColor);
