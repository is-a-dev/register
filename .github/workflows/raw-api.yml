name: Raw API

on:
    push:
        branches: [main]
        paths:
            - "domains/*"
            - ".github/workflows/raw-api.yml"
            - "util/raw-api.js"
            - "util/reserved.json"

    workflow_dispatch:

concurrency:
    group: ${{ github.ref }}-raw-api
    cancel-in-progress: true

jobs:
    update:
        name: Update
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

            - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
              with:
                  node-version: 20.x

            - name: Update Data
              run: node util/raw-api.js

            - name: Create CNAME
              run: echo "raw.is-a.dev" > raw-api/CNAME

            - name: Create timestamp
              run: echo "$(date +%s%3N)" > raw-api/timestamp

            - name: Commit
              uses: cpina/github-action-push-to-another-repository@55306faa4ed53b815ae49e564af8cfb359d32ae2 # v1.7.3
              with:
                  source-directory: "raw-api"
                  destination-github-username: is-a-dev
                  destination-repository-name: raw-api
                  user-email: "bot@is-a.dev"
                  user-name: "is-a-dev-bot"
              env:
                  API_TOKEN_GITHUB: ${{ secrets.BOT }}
